ass=\"num\">02</span><div><div class=\"pname\" style=\"font-size:16px\">Ինչո՞վ ենք զբաղվում</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:12.8px; line-height:1.38;\"><p style=\"margin-top:0px\">Մենք զարգացնում ենք արագ սննդի բրենդ՝ ձգտելով ցույց տալ, որ արագությունն ու բարձր որակը պարտադիր չէ, որ հակասեն միմյանց։</p><p style=\"margin-top:6px\"><span style=\"font-weight:500; color:#0B0B0B;\">Sausage Lab by Big Daddy’s</span>-ը Big Daddy-ի մասնագիտացված արտադրական գիծն է՝ նվիրված բարձրորակ, ձեռագործ նրբերշիկների ստեղծմանը և Big Daddy-ի նույն փիլիսոփայության՝ որակի, համի և արտադրանքի նկատմամբ պատասխանատու մոտեցման շարունակությանը։</p><p style=\"margin-top:6px\">Sausage Lab-ի հիմքում համադրվում են աշխարհի տարբեր խոհանոցների ավանդույթներն ու մեր սեփական մոտեցումը։ Մենք ուսումնասիրում ենք դասական համաշխարհային բաղադրատոմսերը, պահպանում դրանց բնորոշ առանձնահատկությունները և ստեղծում հեղինակային մեկնաբանություններ՝ դրանք համապատասխանեցնելով հայկական շուկայի նախասիրությունների և մշակույթին։</p><p style=\"margin-top:6px\">Ձեռքի աշխատանքը, ընտրված մաքուր և որակյալ հումքը, ինչպես նաև մանրուքների նկատմամբ ուշադրությունը մեզ թույլ են տալիս ստեղծել արտահայտված բնավորությամբ, յուրահատուկ համով և կայուն որակով արտադրանք։</p><p style=\"margin-top:6px\">Մեզ համար նրբերշիկը պարզապես fast food-ի բաղադրիչ չէ․ այն ինքնուրույն գաստրոնոմիական արտադրանք է՝ իր պատմությամբ, բնավորությամբ և համային առանձնահատկություններով։</p></div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 10px;\"><span class=\"num\">03</span><div><div class=\"pname\" style=\"font-size:16px\">Ո՞ւր ենք գնում</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:12.8px; line-height:1.38;\"><p style=\"margin-top:0px\">Այսօր Big Daddy-ն արդեն ձևավորված բրենդ է՝ սեփական արտադրանքով, փորձով և հստակ սկզբունքներով։ Մեր զարգացման հաջորդ փուլը ներկայության ընդլայնումն ու բիզնեսի մասշտաբավորումն է՝ պահպանելով այն սկզբնական փիլիսոփայությունը, որի վրա հիմնվել է բրենդը։</p><p style=\"margin-top:6px\">Այս զարգացման մեջ Sausage Lab-ն ունի իր առանձնահատուկ տեղը։ Մեր նպատակն է ձևավորել ձեռագործ նրբերշիկների ճանաչելի և ամբողջական տեսականի՝ համադրելով համաշխարհային խոհանոցների դասական բաղադրատոմսերը և մեր հեղինակային մշակումները, և հետևողականորեն ընդլայնել այն։</p><p style=\"margin-top:6px\"><span style=\"font-weight:500; color:#0B0B0B;\">Մենք ցանկանում ենք ցույց տալ, որ ժամանակակից fast food-ը կարող է լինել ոչ միայն արագ և հարմար, այլ նաև բարձրորակ ու լիարժեք գաստրոնոմիական փորձ՝ հիմնված այնպիսի արտադրանքի վրա, որին վստահում են և որը ցանկանում են կրկին ընտրել։</span></p></div></div></div></div>\n  </div>\n</div>\n</div>", "s": 1}, {"h": "<div class=\"dcroot\" style=\"width:1588px;height:1123px;\">\n<div class=\"spread\">\n  <div class=\"page photo-page\">\n    <div class=\"slotbox\" style=\"position:absolute; inset:0;\"></div><img src=\"img/97f28061e9b568d88007529e8306753a.webp\" alt=\"622157144_18105375136686220_7777076743661951532_n\" width=\"712\" height=\"890\" style=\"width: 100%; height: 100%\"><div class=\"ov\" style=\"background:linear-gradient(to top, rgba(11,11,11,0.29) 0%, rgba(11,11,11,0) 100%), linear-gradient(to bottom, rgba(11,11,11,0.23) 0%, rgba(11,11,11,0) 60%), linear-gradient(to right, rgba(11,11,11,0.57) 0%, rgba(11,11,11,0) 42%), linear-gradient(to left, rgba(11,11,11,0.26) 0%, rgba(11,11,11,0) 36%);\"><div class=\"bigcap\" style=\"position: absolute; left: 30px; font-size: 84px; top: 631px; width: 432px; height: 240px\">Experiment<br>in flavor.</div></div>\n    <div class=\"rh\" style=\"color:rgba(255,255,255,.8)\"><span>04</span><span>Ինչո՞ւ մենք</span><span>Sausage Lab</span></div>\n    <div style=\"position:absolute; left:56px; top:88px;\"><div class=\"wm\" style=\"font-size:17px;\">Sausage Lab</div><div class=\"endorse\" style=\"font-size:15px; margin-top:3px;\">by Big Daddy’s</div></div>\n    <div style=\"box-sizing: border-box; position: absolute; left: 56px; top: 974px; display: flex; flex-direction: column; gap: 12px\"></div>\n    \n  </div>\n  <div class=\"page\" style=\"background:var(--bone)\">\n    <div class=\"rh\"><span>Sausage Lab</span><span>Ինչո՞ւ մենք</span><span>05</span></div>\n    <div class=\"rule-red\" style=\"left:56px; top:110px;\"></div><div class=\"h-display\" style=\"position:absolute; left:56px; right:56px; top:176px; font-size:40px;\">Ինչո՞ւ Sausage Lab</div>\n    <div style=\"position:absolute; left:56px; right:56px; top:250px; border-bottom:1px solid var(--rule);\"><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">01</span><div><div class=\"pname\" style=\"font-size:16px\">Ձեռքի աշխատանք</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Յուրաքանչյուր արտադրանք պատրաստվում է ձեռքով՝ մանրուքների նկատմամբ ուշադրությամբ և արտադրության յուրաքանչյուր փուլում մեր չափանիշների պահպանմամբ։ Մեզ համար ձեռքի աշխատանքը ոչ միայն արտադրության եղանակ է, այլ արտադրանքի նկատմամբ ավելի մեծ վերահսկողություն ապահովելու և դրա բնավորությունը պահպանելու հնարավորություն։</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">02</span><div><div class=\"pname\" style=\"font-size:16px\">Համաշխարհային և հեղինակային բաղադրատոմսեր</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Մենք աշխատում ենք Ավստրիայի, Գերմանիայի, Իսպանիայի, Մեքսիկայի, Արգենտինայի և ԱՄՆ-ի դասական բաղադրատոմսերով, ինչպես նաև ստեղծում ենք սեփական մշակումները։ Մենք համադրում ենք տարբեր գաստրոնոմիական մշակույթների ավանդույթները սեփական մոտեցման հետ՝ պահպանելով յուրաքանչյուր բաղադրատոմսի բնավորությունը և զարգացնելով այն Sausage Lab-ի հայեցակարգի շրջանակում։</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">03</span><div><div class=\"pname\" style=\"font-size:16px\">Առանց սննդային հավելումների</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Մենք մեր բաղադրատոմսերում չենք օգտագործում արհեստական կոնսերվանտներ և տեխնոլոգիական հավելումներ։ Արտադրանքի հիմքում միսն է, համեմունքները և տվյալ բաղադրատոմսով նախատեսված բնական բաղադրիչները՝ ձեթ, գինի և այլ բաղադրիչներ։ Մենք հետևում ենք պարզ և հասկանալի բաղադրության սկզբունքին և չենք օգտագործում E-կոդերով նշվող սննդային հավելումներ պարունակող բաղադրիչներ։</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">04</span><div><div class=\"pname\" style=\"font-size:16px\">Ընտրված հումք</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Մենք առանձնահատուկ ուշադրություն ենք դարձնում յուրաքանչյուր հիմնական բաղադրիչի ընտրությանը, քանի որ հենց հումքն է պատրաստի արտադրանքի համի, կառուցվածքի և բնավորության հիմքը։ Մենք ընտրում ենք մաքուր և որակյալ հումք, որը համապատասխանում է մեր պահանջներին։</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">05</span><div><div class=\"pname\" style=\"font-size:16px\">Կայուն որակ</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Մենք ձգտում ենք ապահովել արտադրանքի կայուն համը, կառուցվածքը և որակը՝ յուրաքանչյուր խմբաքանակից մյուսը։ Մեզ համար կարևոր է, որ արտադրանքը համապատասխանի մեր չափանիշներին՝ անկախ արտադրության ծավալից և ժամանակից։</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">06</span><div><div class=\"pname\" style=\"font-size:16px\">Արտադրանք՝ գործընկերոջ պահանջներին համապատասխան</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Մենք բաց ենք նոր բաղադրատոմսերի և համային լուծումների մշակման համար՝ հաշվի առնելով կոնկրետ գործընկերոջ հայեցակարգը, ձևաչափը և թիրախային լսարանը։ Սա հնարավորություն է տալիս ստեղծել արտադրանք ոչ միայն ընդհանուր շուկայի, այլև կոնկրետ գաստրոնոմիական հայեցակարգի համար։</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:11px 0 9px;\"><span class=\"num\">07</span><div><div class=\"pname\" style=\"font-size:16px\">Ճկունություն և զարգացում</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:12.6px; line-height:1.38;\">Մենք պատրաստ ենք գործընկերների հետ միասին զարգացնել տեսականին, փորձարկել նոր գաղափարներ, ստեղծել հատուկ արտադրանքներ և աստիճանաբար ընդլայնել տեսականին՝ հիմնվելով հետադարձ կապի և պահանջարկի վրա։</div></div></div></div>\n  </div>\n</div>\n</div>", "s": 1}, {"h": "<div class=\"dcroot\" style=\"width:1588px;height:1123px;\">\n<div class=\"spread\">\n  <div class=\"page photo-page\">\n    <div class=\"slotbox\" style=\"position:absolute; inset:0;\"><img src=\"img/3c1d53b73fbb9e62b9a1a037d49fca7b.webp\" alt=\"Copilot_20261002_234014\" width=\"645\" height=\"967\" style=\"width: 645px; height: auto;\"><span class=\"slot-hint\">Լրիվ էջի լուսանկար՝ բոլոր նրբերշիկները տախտակի վրա, տեսք վերևից։ Մգացումը՝ Tweaks-ում</span></div><div class=\"ov\" style=\"background:linear-gradient(to top, rgba(11,11,11,0.34) 0%, rgba(11,11,11,0) 100%), linear-gradient(to bottom, rgba(11,11,11,1.0) 0%, rgba(11,11,11,0) 48%), linear-gradient(to bottom, rgba(11,11,11,0.33) 0%, rgba(11,11,11,0) 60%);\"></div>\n    <div class=\"rh\" style=\"color:rgba(255,255,255,.8)\"><span>06</span><span>Տեսականի</span><span>Sausage Lab</span></div>\n    <div style=\"position:absolute; left:56px; top:88px;\"><div class=\"wm\" style=\"font-size:17px;\">Sausage Lab</div><div class=\"endorse\" style=\"font-size:15px; margin-top:3px;\">by Big Daddy’s</div></div>\n    \n    \n    \n  </div>\n  <div class=\"page\">\n    <div style=\"position: absolute; contain: layout; overflow: hidden; width: 880px; height: 451px; transform :absolute; left:56px; right:56px; top:168px; font-size:38px;\">От гриля Big Daddy’s к лаборатории колбасок.</div>\n    <div style=\"position:absolute; left:56px; right:56px; top:266px; border-bottom:1px solid var(--rule);\"><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:16px 0 12px;\"><span class=\"num\">01</span><div><div class=\"pname\" style=\"font-size:16px\">Кто мы</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:14.5px; line-height:1.42;\"><p style=\"margin-top:0px\">Big Daddy — семейный бренд, созданный 6 лет назад с одним простым принципом: создавать продукты, которые мы сами хотели бы выбирать для себя и своей семьи — вкусные, качественные и надежные.</p><p style=\"margin-top:6px\">Именно так сформировалась философия Big Daddy, которой мы придерживаемся до сих пор: если мы готовы предложить продукт своей семье, мы должны быть уверены в его качестве и составе, сохраняя те же стандарты и для наших гостей.</p></div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:16px 0 12px;\"><span class=\"num\">02</span><div><div class=\"pname\" style=\"font-size:16px\">Чем мы занимаемся</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:14.5px; line-height:1.42;\"><p style=\"margin-top:0px\">Мы развиваем бренд быстрого питания, стремясь показать, что скорость и высокое качество не обязательно должны противоречить друг другу.</p><p style=\"margin-top:6px\"><span style=\"font-weight:500; color:#0B0B0B;\">Sausage Lab by Big Daddy’s</span> — специализированная производственная линия Big Daddy, посвященная созданию высококачественных колбасок ручной работы и продолжающая ту же философию Big Daddy — качества, вкуса и ответственного отношения к продукту.</p><p style=\"margin-top:6px\">В основе Sausage Lab — сочетание традиций различных кухонь мира и нашего собственного подхода. Мы изучаем классические мировые рецептуры, сохраняем их характерные особенности и создаём авторские интерпретации, адаптируя их к предпочтениям и культуре армянского рынка.</p><p style=\"margin-top:6px\">Ручная работа, отборное чистое и качественное сырьё, а также внимание к деталям позволяют нам создавать продукт с ярко выраженным характером, уникальным вкусом и стабильным качеством.</p><p style=\"margin-top:6px\">Для нас колбаска — это не просто ингредиент fast food, а самостоятельный гастрономический продукт со своей историей, характером и вкусовыми особенностями.</p></div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:16px 0 12px;\"><span class=\"num\">03</span><div><div class=\"pname\" style=\"font-size:16px\">Куда мы движемся</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:14.5px; line-height:1.42;\"><p style=\"margin-top:0px\">Сегодня Big Daddy — уже сформированный бренд со своей продукцией, опытом и четкими принципами. Следующий этап нашего развития — расширение присутствия и масштабирование бизнеса при сохранении первоначальной философии, на которой был основан бренд.</p><p style=\"margin-top:6px\">В этом развитии Sausage Lab занимает особое место. Наша цель — сформировать узнаваемый и цельный ассортимент колбасок ручной работы, объединяющий классические рецептуры мировой кухни и наши авторские разработки, и последовательно расширять его.</p><p style=\"margin-top:6px\"><span style=\"font-weight:500; color:#0B0B0B;\">Мы хотим показать, что современный fast food может быть не только быстрым и удобным, но и высококачественным, полноценным гастрономическим опытом, основанным на продукте, которому доверяют и который хочется выбирать снова.</span></p></div></div></div></div>\n  </div>\n</div>\n</div>", "s": 1}, {"h": "<div class=\"dcroot\" style=\"width:1588px;height:1123px;\">\n<div class=\"spread\">\n  <div class=\"page photo-page\">\n    <div class=\"slotbox\" style=\"position:absolute; inset:0;\"></div><img src=\"img/97f28061e9b568d88007529e8306753a.webp\" alt=\"622157144_18105375136686220_7777076743661951532_n\" width=\"712\" height=\"890\" style=\"width: 100%; height: 100%\"><div class=\"ov\" style=\"background:linear-gradient(to top, rgba(11,11,11,0.29) 0%, rgba(11,11,11,0) 100%), linear-gradient(to bottom, rgba(11,11,11,0.23) 0%, rgba(11,11,11,0) 60%), linear-gradient(to right, rgba(11,11,11,0.57) 0%, rgba(11,11,11,0) 42%), linear-gradient(to left, rgba(11,11,11,0.26) 0%, rgba(11,11,11,0) 36%);\"><div class=\"bigcap\" style=\"position: absolute; left: 30px; font-size: 84px; top: 631px; width: 432px; height: 240px\">Experiment<br>in flavor.</div></div>\n    <div class=\"rh\" style=\"color:rgba(255,255,255,.8)\"><span>04</span><span>Почему мы</span><span>Sausage Lab</span></div>\n    <div style=\"position:absolute; left:56px; top:88px;\"><div class=\"wm\" style=\"font-size:17px;\">Sausage Lab</div><div class=\"endorse\" style=\"font-size:15px; margin-top:3px;\">by Big Daddy’s</div></div>\n    <div style=\"box-sizing: border-box; position: absolute; left: 56px; top: 974px; display: flex; flex-direction: column; gap: 12px\"></div>\n    \n  </div>\n  <div class=\"page\" style=\"background:var(--bone)\">\n    <div class=\"rh\"><span>Sausage Lab</span><span>Почему мы</span><span>05</span></div>\n    <div class=\"rule-red\" style=\"left:56px; top:110px;\"></div><div class=\"h-display\" style=\"position:absolute; left:56px; right:56px; top:176px; font-size:40px;\">Почему Sausage Lab</div>\n    <div style=\"position:absolute; left:56px; right:56px; top:250px; border-bottom:1px solid var(--rule);\"><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">01</span><div><div class=\"pname\" style=\"font-size:16px\">Ручная работа</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Каждый продукт создаётся вручную, с вниманием к деталям и соблюдением наших стандартов на каждом этапе производства. Для нас ручная работа — это возможность лучше контролировать продукт и сохранять его характер.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">02</span><div><div class=\"pname\" style=\"font-size:16px\">Мировые и авторские рецептуры</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Мы работаем с классическими рецептурами Австрии, Германии, Испании, Мексики, Аргентины и США, а также создаём собственные разработки. Мы объединяем традиции разных гастрономических культур с собственным взглядом на продукт, сохраняя характер каждой рецептуры и развивая её в рамках концепции Sausage Lab.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">03</span><div><div class=\"pname\" style=\"font-size:16px\">Без пищевых добавок</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Мы не используем в своих рецептурах искусственные консерванты и технологические добавки. В основе продукта — мясо, специи и натуральные ингредиенты, предусмотренные конкретной рецептурой: масло, вино и другие компоненты. Мы придерживаемся принципа понятного состава и не используем ингредиенты с пищевыми добавками, обозначаемыми E-кодами.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">04</span><div><div class=\"pname\" style=\"font-size:16px\">Отборное сырьё</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Мы тщательно подходим к выбору каждого основного ингредиента, поскольку именно сырьё является основой вкуса, текстуры и характера готового продукта. Мы выбираем чистое и качественное сырьё, соответствующее нашим требованиям.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">05</span><div><div class=\"pname\" style=\"font-size:16px\">Стабильное качество</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Мы стремимся обеспечивать стабильный вкус, текстуру и качество от партии к партии. Для нас важно, чтобы продукт соответствовал нашим стандартам независимо от объёма и времени производства.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">06</span><div><div class=\"pname\" style=\"font-size:16px\">Продукт под задачу партнёра</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Мы открыты к разработке новых рецептур и вкусовых решений с учётом концепции, формата и аудитории конкретного партнёра. Это позволяет создавать продукт не только для рынка в целом, но и под конкретную гастрономическую концепцию.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">07</span><div><div class=\"pname\" style=\"font-size:16px\">Гибкость и развитие</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Мы готовы развивать ассортимент вместе с партнёрами, тестировать новые идеи, создавать специальные позиции и постепенно расширять линейку на основе обратной связи и спроса.</div></div></div></div>\n  </div>\n</div>\n</div>", "s": 1}, {"h": "<div class=\"dcroot\" style=\"width:1588px;height:1123px;\">\n<div class=\"spread\">\n  <div class=\"page photo-page\">\n    <div class=\"slotbox\" style=\"position:absolute; inset:0;\"><img src=\"img/3c1d53b73fbb9e62b9a1a037d49fca7b.webp\" alt=\"Copilot_20261002_234014\" width=\"645\" height=\"967\" style=\"width: 645px; height: auto;\"><span class=\"slot-hint\">Full-page photo: all sausages on a board, top view. Darkening — in Tweaks</span></div><div class=\"ov\" style=\"background:linear-g ss=\"slotbox\" style=\"position:absolute; inset:0;\"></div><div style=\"position:absolute; left:326px; top:21px; width:143px; height:1080px; opacity:.45; z-index:0; pointer-events:none;\"><img src=\"img/9a557ba30338e4cf10847de23801a38f.webp\" alt=\"Group 6\" style=\"width:143px; height:1080px; display:block;\"></div><div class=\"ov\" style=\"background: linear-gradient(to top, rgba(11,11,11,0.06) 0%, rgba(11,11,11,0) 85%); top: 4px; height: 1181px\"></div>\n  <div style=\"position:absolute; left:56px; right:56px; top:56px; display:flex; justify-content:space-between; font:500 9px 'IBM Plex Mono', monospace; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.75);\"><span>Partnership proposal</span><span>2026</span></div>\n  <div style=\"position: absolute; left: 0; right: 0; bottom: 139px; text-align: center\">\n    <div class=\"wm\" style=\"font-size:56px;\">Sausage Lab</div>\n    <div style=\"width:140px; height:1px; background:#fff; margin:18px auto 6px;\"></div>\n    <div class=\"endorse\" style=\"font-size:34px;\">by Big Daddy’s</div>\n  </div>\n  <div style=\"position: absolute; left: 0; right: 0; bottom: 139px; text-align: center\">\n    \n    \n  </div>\n  \n</div>\n</div>", "s": 0}, {"h": "<div class=\"dcroot\" style=\"width:1588px;height:1123px;\">\n<div class=\"spread\">\n  <div class=\"page photo-page\">\n    <div class=\"slotbox\" style=\"position:absolute; inset:0;\"><img src=\"img/284e07bcb353454b895957f2a61b83d1.webp\" alt=\"625340686_18348561022229100_5855106478744229954_n\" width=\"692\" height=\"692\" style=\"height: 1170px; position: relative; width: 1161px; object-fit: scale-down; left: 0px\"></div><div class=\"ov\" style=\"background: linear-gradient(to top, rgba(11,11,11,0.63) 0%, rgba(11,11,11,0) 100%), linear-gradient(to bottom, rgba(11,11,11,0.17) 0%, rgba(11,11,11,0) 50%), linear-gradient(to left, rgba(11,11,11,0.55) 0%, rgba(11,11,11,0) 100%); left: 0px\"><div class=\"bigcap\" style=\"position: absolute; left: 290px; font-size: 84px; width: 486px; height: 247px; top: 772px\">MEAT&nbsp;<br>&amp; FIRE<br>NO FILLER</div></div>\n    <div class=\"rh\" style=\"color:rgba(255,255,255,.8)\"><span>02</span><span>Sausage Lab</span><span>Sausage Lab</span></div>\n    <div style=\"position:absolute; left:56px; top:88px;\"><div class=\"wm\" style=\"font-size:17px;\">Sausage Lab</div><div class=\"endorse\" style=\"font-size:15px; margin-top:3px;\">by Big Daddy’s</div></div>\n    \n    \n  </div>\n  <div class=\"page\">\n    <div class=\"rh\"><span>Sausage Lab</span><span>About us</span><span>03</span></div>\n    <div class=\"rule-red\" style=\"left:56px; top:110px;\"></div><div class=\"h-display\" style=\"position:absolute; left:56px; right:56px; top:168px; font-size:38px;\">From the Big Daddy’s grill to a sausage laboratory.</div>\n    <div style=\"position:absolute; left:56px; right:56px; top:266px; border-bottom:1px solid var(--rule);\"><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:16px 0 12px;\"><span class=\"num\">01</span><div><div class=\"pname\" style=\"font-size:16px\">Who we are</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:14.5px; line-height:1.42;\"><p style=\"margin-top:0px\">Big Daddy is a family brand created 6 years ago with one simple principle: to make products we would gladly choose for ourselves and our families — tasty, high-quality and reliable.</p><p style=\"margin-top:6px\">That is how the Big Daddy philosophy took shape, and we still follow it today: if we are ready to offer a product to our own family, we must be sure of its quality and composition, and keep the same standards for our guests.</p></div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:16px 0 12px;\"><span class=\"num\">02</span><div><div class=\"pname\" style=\"font-size:16px\">What we do</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:14.5px; line-height:1.42;\"><p style=\"margin-top:0px\">We are developing a fast-food brand, aiming to show that speed and high quality do not have to contradict each other.</p><p style=\"margin-top:6px\"><span style=\"font-weight:500; color:#0B0B0B;\">Sausage Lab by Big Daddy’s</span> — a specialized Big Daddy production line dedicated to high-quality handmade sausages, continuing the same Big Daddy philosophy of quality, flavor and a responsible attitude to the product.</p><p style=\"margin-top:6px\">At the core of Sausage Lab is a blend of the traditions of different world cuisines and our own approach. We study classic recipes from around the world, preserve their distinctive features and create our own interpretations, adapting them to the tastes and culture of the Armenian market.</p><p style=\"margin-top:6px\">Handmade production, carefully selected clean, high-quality raw materials and attention to detail allow us to create a product with a distinct character, a unique flavor and consistent quality.</p><p style=\"margin-top:6px\">For us, a sausage is not just a fast-food ingredient, but a gastronomic product in its own right, with its own story, character and flavor profile.</p></div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:16px 0 12px;\"><span class=\"num\">03</span><div><div class=\"pname\" style=\"font-size:16px\">Where we are heading</div><div class=\"body-serif\" style=\"margin-top:7px; font-size:14.5px; line-height:1.42;\"><p style=\"margin-top:0px\">Today Big Daddy is an established brand with its own products, experience and clear principles. The next stage of our development is expanding our presence and scaling the business while keeping the original philosophy on which the brand was founded.</p><p style=\"margin-top:6px\">Sausage Lab has a special place in this growth. Our goal is to build a recognizable, cohesive range of handmade sausages that combines classic world recipes with our own creations, and to expand it steadily.</p><p style=\"margin-top:6px\"><span style=\"font-weight:500; color:#0B0B0B;\">We want to show that modern fast food can be not only fast and convenient, but also high-quality and a complete gastronomic experience, built on a product people trust and want to choose again.</span></p></div></div></div></div>\n  </div>\n</div>\n</div>", "s": 1}, {"h": "<div class=\"dcroot\" style=\"width:1588px;height:1123px;\">\n<div class=\"spread\">\n  <div class=\"page photo-page\">\n    <div class=\"slotbox\" style=\"position:absolute; inset:0;\"></div><img src=\"img/97f28061e9b568d88007529e8306753a.webp\" alt=\"622157144_18105375136686220_7777076743661951532_n\" width=\"712\" height=\"890\" style=\"width: 100%; height: 100%\"><div class=\"ov\" style=\"background:linear-gradient(to top, rgba(11,11,11,0.29) 0%, rgba(11,11,11,0) 100%), linear-gradient(to bottom, rgba(11,11,11,0.23) 0%, rgba(11,11,11,0) 60%), linear-gradient(to right, rgba(11,11,11,0.57) 0%, rgba(11,11,11,0) 42%), linear-gradient(to left, rgba(11,11,11,0.26) 0%, rgba(11,11,11,0) 36%);\"><div class=\"bigcap\" style=\"position: absolute; left: 30px; font-size: 84px; top: 631px; width: 432px; height: 240px\">Experiment<br>in flavor.</div></div>\n    <div class=\"rh\" style=\"color:rgba(255,255,255,.8)\"><span>04</span><span>Why us</span><span>Sausage Lab</span></div>\n    <div style=\"position:absolute; left:56px; top:88px;\"><div class=\"wm\" style=\"font-size:17px;\">Sausage Lab</div><div class=\"endorse\" style=\"font-size:15px; margin-top:3px;\">by Big Daddy’s</div></div>\n    <div style=\"box-sizing: border-box; position: absolute; left: 56px; top: 974px; display: flex; flex-direction: column; gap: 12px\"></div>\n    \n  </div>\n  <div class=\"page\" style=\"background:var(--bone)\">\n    <div class=\"rh\"><span>Sausage Lab</span><span>Why us</span><span>05</span></div>\n    <div class=\"rule-red\" style=\"left:56px; top:110px;\"></div><div class=\"h-display\" style=\"position:absolute; left:56px; right:56px; top:176px; font-size:40px;\">Why Sausage Lab</div>\n    <div style=\"position:absolute; left:56px; right:56px; top:250px; border-bottom:1px solid var(--rule);\"><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">01</span><div><div class=\"pname\" style=\"font-size:16px\">Handmade</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">Every product is made by hand, with attention to detail and to our standards at every stage of production. For us, handcrafting means better control over the product and preserving its character.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">02</span><div><div class=\"pname\" style=\"font-size:16px\">World and signature recipes</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">We work with classic recipes of Austria, Germany, Spain, Mexico, Argentina and the USA, and also create our own. We combine the traditions of different gastronomic cultures with our own view of the product, preserving the character of each recipe and developing it within the Sausage Lab concept.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">03</span><div><div class=\"pname\" style=\"font-size:16px\">No food additives</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">We do not use artificial preservatives or technological additives in our recipes. The product is built on meat, spices and natural ingredients required by the specific recipe: oil, wine and other components. We follow the principle of a clear composition and do not use ingredients containing additives labeled with E-codes.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">04</span><div><div class=\"pname\" style=\"font-size:16px\">Selected raw materials</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">We choose every main ingredient with care, because raw material is the foundation of the flavor, texture and character of the finished product. We select clean, high-quality raw materials that meet our requirements.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">05</span><div><div class=\"pname\" style=\"font-size:16px\">Consistent quality</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">We strive to ensure consistent flavor, texture and quality from batch to batch. It matters to us that the product meets our standards regardless of volume and time of production.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">06</span><div><div class=\"pname\" style=\"font-size:16px\">A product for the partner’s needs</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">We are open to developing new recipes and flavor solutions based on the concept, format and audience of a specific partner. This lets us create a product not only for the market in general, but for a specific gastronomic concept.</div></div></div><div class=\"hair\" style=\"display:grid; grid-template-columns:56px 1fr; gap:6px; padding:13px 0 11px;\"><span class=\"num\">07</span><div><div class=\"pname\" style=\"font-size:16px\">Flexibility and growth</div><div class=\"body-serif\" style=\"margin-top:6px; font-size:13.8px; line-height:1.42;\">We are ready to grow the range together with partners, test new ideas, create special items and gradually expand the line based on feedback and demand.</div></div></div></div>\n  </div>\n const LANGS = { hy: 'ՀԱՅ', ru: 'РУС', en: 'ENG' };
const TITLES = { hy: 'Sausage Lab by Big Daddy’s — Կատալոգ', ru: 'Sausage Lab by Big Daddy’s — Каталог', en: 'Sausage Lab by Big Daddy’s — Catalog' };
const TOTAL = 12;
let lang = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('lang') || 'hy';
if (!BOOK[lang]) lang = 'hy';
let flip = null, cur = Math.max(0, Math.min(11, parseInt(new URLSearchParams(location.search).get('p') || '0', 10) || 0));

function pageHTML(h, off) { return '<div class="pg"><div class="pgin"><div class="inner" style="left:' + off + 'px">' + h + '</div></div></div>'; }
function pagesFor(l) {
  const out = [];
  BOOK[l].forEach(p => { if (p.s) { out.push(pageHTML(p.h, 0)); out.push(pageHTML(p.h, -794)); } else out.push(pageHTML(p.h, 0)); });
  return out;
}

function mount() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const aw = stage.clientWidth - 24, ah = stage.clientHeight - 20;
  const single = aw < 620 || aw / ah < 0.85;
  const k = Math.min(aw / (single ? 794 : 1588), ah / 1123) * 0.97;
  const pw = Math.floor(794 * k), ph = Math.floor(1123 * k);
  stage.style.setProperty('--k', k);
  const holder = document.createElement('div');
  holder.id = 'book';
  holder.style.width = (single ? pw : pw * 2 + 40) + 'px';
  holder.style.height = ph + 'px';
  const shift = document.createElement('div');
  shift.id = 'shift';
  shift.appendChild(holder);
  stage.appendChild(shift);
  pagesFor(lang).forEach(s => holder.insertAdjacentHTML('beforeend', s));
  flip = new St.PageFlip(holder, {
    width: pw, height: ph, size: 'fixed',
    showCover: true, usePortrait: single, maxShadowOpacity: .5, drawShadow: true,
    flippingTime: 750, mobileScrollSupport: false, startPage: Math.min(cur, TOTAL - 1)
  });
  flip.loadFromHTML(holder.querySelectorAll('.pg'));
  flip.on('flip', e => { cur = e.data; ui(); });
  flip.on('changeOrientation', () => ui());
  ui();
  setTimeout(ui, 150); setTimeout(ui, 600);
}

function ui() {
  const landscape = flip && flip.getOrientation && flip.getOrientation() === 'landscape';
  let t;
  if (landscape && cur > 0 && cur < TOTAL - 1) { const a = cur % 2 ? cur + 1 : cur; t = (a) + '–' + (a + 1); }
  else t = String(cur + 1);
  const bk = document.getElementById('shift');
  if (bk && flip) { const w = document.getElementById('book').offsetWidth / 2; bk.style.transform = landscape ? (cur === 0 ? 'translateX(' + (-w / 2) + 'px)' : (cur >= TOTAL - 1 ? 'translateX(' + (w / 2) + 'px)' : '')) : ''; }
  document.getElementById('ind').textContent = t + ' / ' + TOTAL;
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.documentElement.lang = lang;
  document.title = TITLES[lang];
}

function setLang(l) {
  if (!BOOK[l] || l === lang) return;
  lang = l;
  history.replaceState(null, '', '#' + l);
  mount();
}

(function init() {
  const box = document.getElementById('langs');
  Object.keys(LANGS).forEach(l => {
    const b = document.createElement('button');
    b.textContent = LANGS[l]; b.dataset.l = l;
    b.onclick = () => setLang(l);
    box.appendChild(b);
  });
  document.getElementById('prev').onclick = () => flip && flip.flipPrev();
  document.getElementById('next').onclick = () => flip && flip.flipNext();
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') flip && flip.flipNext();
    if (e.key === 'ArrowLeft') flip && flip.flipPrev();
  });
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(mount, 250); });
  document.fonts && document.fonts.ready.then(() => { mount(); });
  mount();
})();
